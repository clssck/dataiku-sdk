name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      candidate-artifact:
        description: Versioned candidate to restore and smoke-test without repacking
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: ${{ matrix.os }} / Bun ${{ matrix.bun }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        # The advertised minimum (package.json engines) and the latest release.
        bun:
          - 1.4.0
          - 1.4.2

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.candidate-artifact != ''
        with:
          name: ${{ inputs.candidate-artifact }}
          path: ${{ runner.temp }}/candidate

      - name: Restore release candidate source
        if: inputs.candidate-artifact != ''
        shell: bash
        run: bun scripts/release-candidate.mjs restore "$RUNNER_TEMP/candidate"

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Smoke packaged CLI and skill
        shell: bash
        env:
          CANDIDATE_ARTIFACT: ${{ inputs.candidate-artifact }}
        run: |
          if [[ -n "$CANDIDATE_ARTIFACT" ]]; then
            bun run test:platform --candidate "$RUNNER_TEMP/candidate"
          else
            bun run test:platform
          fi
